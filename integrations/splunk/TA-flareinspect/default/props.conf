# FlareInspect — Splunk Add-on (TA-flareinspect)
# Field extractions for sourcetype cloudflare:flareinspect:finding

[vendor flareinspect]
INDEXED_EXTRACTIONS = csv
KV_MODE = json
AUTO_KV_JSON = true
JSON_TRIM_BRACES_IN_ARRAY_NAMES = true
TIME_PREFIX = {"time":\s*\"
TIME_FORMAT = %s.%Q
MAX_TIMESTAMP_LOOKAHEAD = 32
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TZ = UTC

# Explicit field aliases — keep CIM-compatible
FIELDALIAS-vendor = src as source
FIELDALIAS-vendor = sourcetype as sourcetype
ALIAS-event = event_hash as vulnerability.signature
ALIAS-event = event_vendor as vulnerability.vendor
ALIAS-event = event_product as vulnerability.product
ALIAS-event = event_severity as vulnerability.severity
ALIAS-event = event_signature as vulnerability.signature
ALIAS-event = event_description as vulnerability.description
ALIAS-event = event_solution as vulnerability.solution
