[flareinspect-critical-open]
search = `flareinspect` vulnerability.severity=critical status=failed
dispatch.earliest_time = -7d
dispatch.latest_time = now
description = FlareInspect critical findings still open in the last 7 days.
action.email = 0

[flareinspect-high-attack-paths]
search = `flareinspect` vulnerability.severity IN (critical, high) | spath input=event.flareinspect.attack_paths output=paths | mvexpand paths | spath input=paths | stats count values(title) values(severity) by flareinspect.assessment_id, flareinspect.node_id | sort - count
dispatch.earliest_time = -7d
dispatch.latest_time = now
description = FlareInspect findings that participate in attack paths (last 7 days).
action.email = 0
