# FlareInspect — Splunk Add-on transforms
# Field renames that don't fit the simple FIELDALIAS syntax

[rename_attack_paths]
REGEX = flareinspect{[^}]*attack_path_ids":\s*\[([^\]]*)\]
FORMAT = attack_path_ids::$1

[severity_normalize]
REGEX = "severity":\s*"(?P<severity>[a-z]+)"
FORMAT = severity::$1
